[package]
name = "wikimind-api"
version = "0.1.0"
edition = "2021"

[lib]
name = "wikimind_api"
path = "lib.rs"

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1.44"

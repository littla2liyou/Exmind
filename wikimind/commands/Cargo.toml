[package]
name = "wikimind-commands"
version = "0.1.0"
edition = "2021"

[lib]
name = "wikimind_commands"
path = "src/lib.rs"

[dependencies]
tauri = { version = "2" }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

wikimind-runtime = { path = "../runtime" }
wikimind-api = { path = "../api" }
tracing = "0.1.44"

[package]
name = "wikimind-runtime"
version = "0.1.0"
edition = "2021"

[lib]
name = "wikimind_runtime"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
glob = "0.3"
walkdir = "2"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
wikimind-telemetry = { path = "../telemetry" }
similar = "3.1.0"
gray_matter = "0.3.2"
chrono = "0.4.44"
async-trait = "0.1.89"
eventsource-stream = "0.2.3"
dirs = "6.0.0"

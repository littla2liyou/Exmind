[package]
name = "wikimind-tools"
version = "0.1.0"
edition = "2021"

[lib]
name = "wikimind_tools"
path = "src/lib.rs"

[dependencies]
wikimind-runtime = { path = "../runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
